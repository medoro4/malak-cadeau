<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة ملك | قرطاسية وتجميل – صور</title>
<meta name="description" content="مكتبة ملك في صور – مقابل جامع الوحدة: قرطاسية، أدوات تجميل، عطورات، هدايا، ألعاب، تصوير مستندات وتشريح خطوط وتجليد هويات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D2A60;--gold:#C9A227;--ivory:#FBF8F1;--line:#DCD6C6;--green:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--ivory);color:var(--navy);line-height:1.7}
img{display:block;max-width:100%}
button,input,select,textarea{font-family:inherit;font-size:1rem}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* رأس */
header{position:sticky;top:0;z-index:40;background:var(--ivory);border-bottom:2px solid var(--navy)}
.bar{height:78px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
.mark small{color:var(--gold);font-size:8px}
.mark span{font-weight:800;font-size:19px}
.brand b{font-size:22px;font-weight:800}
nav{display:flex;gap:26px}
nav button{font-weight:700;font-size:17px;padding-bottom:4px;border-bottom:3px solid transparent}
nav button.on{border-color:var(--gold)}
#burger{display:none;font-size:26px}
@media(max-width:760px){nav{display:none;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
nav.open{display:flex}#burger{display:block}.bar{flex-wrap:wrap}nav{width:100%}}

/* عام */
section{padding:44px 0}
h1{font-size:clamp(30px,6vw,54px);font-weight:800;line-height:1.2}
h2{font-size:26px;font-weight:800;margin-bottom:22px}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:2px;margin-bottom:14px}
.hl{background:var(--gold);padding:2px 10px;display:inline-block;margin-top:10px}
.lead{font-size:18px;max-width:640px;margin-top:20px;opacity:.9}
.btn{display:inline-block;padding:13px 26px;font-weight:800;background:var(--gold);color:var(--navy);box-shadow:4px 4px 0 var(--navy)}
.btn.ghost{background:none;border:2px solid var(--navy);box-shadow:none}
.btn.wa{background:var(--green);color:#fff;box-shadow:none;width:100%;text-align:center;padding:16px;font-size:18px}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 43px,rgba(13,42,96,.07) 43px 44px)}

/* أقسام */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.cat{border:2px solid var(--navy);background:#fff;padding:26px 10px;text-align:center;font-weight:700;font-size:17px;box-shadow:5px 5px 0 rgba(13,42,96,.12)}
.cat i{display:block;font-size:28px;margin-bottom:10px;font-style:normal}

/* منتجات */
.search{display:flex;border:2px solid var(--navy);background:#fff;margin-bottom:18px}
.search input{flex:1;border:none;outline:none;padding:13px 16px;background:none}
.search span{padding:0 16px;align-self:center;color:var(--gold);font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:2px solid var(--navy);padding:8px 16px;font-weight:700}
.chip.on{background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{border:2px solid var(--navy);background:#fff;display:flex;flex-direction:column}
.thumb{aspect-ratio:1;background:#eef1f7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .body{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .tag{color:var(--gold);font-size:12px;font-weight:700}
.card h3{font-size:16px;font-weight:700}
.card .price{font-size:21px;font-weight:800;margin-top:2px}
.card button{margin-top:12px;background:var(--gold);padding:10px;font-weight:800}
.empty{text-align:center;padding:70px 0}

/* عربة */
.overlay{position:fixed;inset:0;background:rgba(13,42,96,.45);z-index:50;display:flex;justify-content:flex-start}
.drawer{width:100%;max-width:430px;height:100%;background:var(--ivory);display:flex;flex-direction:column}
.drawer .head{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:2px solid var(--navy)}
.drawer .head h2{margin:0}
.drawer .list{flex:1;overflow-y:auto;padding:20px}
.item{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;padding:12px;margin-bottom:12px}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-size:15px}
.item .n small{opacity:.7}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border:2px solid var(--navy);font-weight:800}
.del{color:#b91c1c;font-size:18px}
.drawer .foot{padding:20px;border-top:2px solid var(--navy)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:10px}
.note{font-size:14px;opacity:.7;margin-bottom:14px}

/* تواصل */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.box{border:2px solid var(--navy);background:#fff;padding:24px}
.dark{background:var(--navy);color:var(--ivory);padding:24px}
.dark h2{color:var(--gold)}
.dark p,.dark a{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:17px}
.dark i{color:var(--gold);font-style:normal}
.field{width:100%;border:2px solid var(--line);padding:12px 14px;margin-bottom:14px;outline:none;background:#fff}

/* إدارة */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr}}
.msg{background:var(--gold);color:var(--navy);font-weight:800;padding:12px 16px;margin-bottom:18px}
.msg.err{background:#fee2e2;color:#b91c1c}
.msg.ok{background:#dcfce7;color:#166534}
.status{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;flex-shrink:0}
.dot.off{background:#9ca3af}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--navy);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.arow{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;padding:12px;margin-bottom:10px}
.arow .t{width:52px;height:52px;background:#eef1f7;flex-shrink:0;overflow:hidden}
.arow .t img{width:100%;height:100%;object-fit:cover}
.arow .i{flex:1;min-width:0}
.arow .i b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .i small{opacity:.7}
.icobtn{font-size:18px;padding:6px}
pre{background:#fff;border:2px solid var(--line);padding:14px;overflow:auto;max-height:240px;direction:ltr;text-align:left;font-size:13px}

/* عائم */
.float{position:fixed;bottom:20px;left:20px;z-index:40;display:flex;flex-direction:column;gap:12px}
.fab{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:24px;position:relative}
.fab.cart{background:var(--navy);color:var(--ivory)}
.fab.wa{background:var(--green);color:#fff}
.badge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:var(--navy);width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:var(--ivory);padding:12px 20px;font-weight:700;z-index:60}

/* تذييل */
footer{background:var(--navy);color:var(--ivory);margin-top:40px}
footer .cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:44px 0}
@media(max-width:760px){footer .cols{grid-template-columns:1fr}}
footer h3{color:var(--gold);margin-bottom:14px;font-size:20px}
footer a,footer p{display:flex;gap:10px;align-items:center;margin-bottom:10px}
footer i{color:var(--gold);font-style:normal}
.copy{border-top:1px solid rgba(251,248,241,.2);display:flex;justify-content:space-between;padding:16px 0;font-size:14px;opacity:.75}
.hide{display:none!important}
</style>
</head>
<body>

<header>
 <div class="wrap bar">
  <button class="brand" onclick="go('home')">
   <span class="mark"><small>مكتبة</small><span>ملك</span></span><b>مكتبة ملك</b>
  </button>
  <button id="burger" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
  <nav id="nav">
   <button data-p="home" onclick="go('home')">الرئيسية</button>
   <button data-p="products" onclick="go('products')">المنتجات</button>
   <button data-p="contact" onclick="go('contact')">تواصل معنا</button>
  </nav>
 </div>
</header>

<main class="wrap" id="main"></main>

<footer>
 <div class="wrap cols">
  <div>
   <h3>مكتبة ملك</h3>
   <p style="display:block;opacity:.85">قرطاسية، تجميل، عطورات، هدايا، ألعاب، وخدمات تصوير المستندات وتشريح الخطوط وتجليد الهويات — في صور، المعشوق.</p>
  </div>
  <div>
   <h3>تواصل معنا</h3>
   <p><i>◉</i><span id="f-addr"></span></p>
   <a id="f-tel"><i>✆</i><span id="f-phone"></span></a>
   <a id="f-wa" target="_blank"><i>✆</i>واتساب</a>
   <a id="f-ig" target="_blank"><i>◎</i><span id="f-ighandle"></span></a>
  </div>
 </div>
 <div class="wrap copy">
  <span>© مكتبة ملك — جميع الحقوق محفوظة.</span>
  <button onclick="go('admin')" style="text-decoration:underline">إدارة</button>
 </div>
</footer>

<div class="float">
 <button class="fab cart" onclick="openCart()">🛒<span class="badge hide" id="badge">0</span></button>
 <a class="fab wa" id="float-wa" target="_blank">✆</a>
</div>

<div id="cart-root"></div>
<div id="toast"></div>

<script>
/* ═══ إعدادات المحل — عدّلها من هنا ═══ */
const CFG = {
  wa: "96171117169",
  phone: "+961 71 117 169",
  ig: "cadeau.malakk",
  email: "cadeaumalak@gmail.com",
  address: "صور – مقابل جامع الوحدة",
  ghOwner: "medoro4",
  ghRepo: "malak-cadeau",
  ghBranch: "main",
  adminPass: "malak2025"
};
const CATS = ["قرطاسية","تجميل","عطورات","هدايا","ألعاب"];
const ICONS = {"قرطاسية":"✎","تجميل":"✧","عطورات":"❦","هدايا":"🎁","ألعاب":"◈","خدمات طباعة":"⎙"};

let PRODUCTS = [], cart = [], page = "home", cat = "الكل", q = "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const waLink = t => `https://wa.me/${CFG.wa}${t ? "?text=" + encodeURIComponent(t) : ""}`;

/* تحميل المنتجات من products.json */
async function loadProducts(){
  try{
    const r = await fetch("products.json?v=" + Date.now());
    PRODUCTS = await r.json();
  }catch{ PRODUCTS = []; }
  if(page === "products" || page === "admin") render();
}

/* ═══ التنقل ═══ */
function go(p){
  page = p;
  document.getElementById("nav").classList.remove("open");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  render(); window.scrollTo(0,0);
}

function render(){
  const m = document.getElementById("main");
  if(page === "home") m.innerHTML = viewHome();
  else if(page === "products") m.innerHTML = viewProducts();
  else if(page === "contact") m.innerHTML = viewContact();
  else if(page === "admin") m.innerHTML = viewAdmin();
}

/* ═══ الرئيسية ═══ */
function viewHome(){
  return `
  <section class="ruled">
    <p class="eyebrow">مكتبة ملك — صور، المعشوق</p>
    <h1>كل شي بتحتاجه…<br><span class="hl">تحت سقف واحد</span></h1>
    <p class="lead">محل متكامل في صور – المعشوق يقدّم قرطاسية، أدوات تجميل، عطورات، هدايا، ألعاب،
    وخدمات تصوير المستندات وتشريح الخطوط وتجليد الهويات.</p>
    <div class="row">
      <button class="btn" onclick="go('products')">تصفح المنتجات</button>
      <a class="btn ghost" href="${waLink()}" target="_blank">اطلب عبر واتساب</a>
    </div>
  </section>
  <section>
    <h2>أقسامنا</h2>
    <div class="cats">${[...CATS,"خدمات طباعة"].map(c =>
      `<button class="cat" onclick="filterTo('${c}')"><i>${ICONS[c]}</i>${c}</button>`).join("")}</div>
  </section>
  <section>
    <div class="box">
      <h2>مكان المحل</h2>
      <p style="font-size:17px">◉ ${CFG.address}</p>
      <p style="font-size:17px;margin-top:8px">✆ ${CFG.phone}</p>
    </div>
  </section>`;
}
function filterTo(c){ cat = CATS.includes(c) ? c : "الكل"; go("products"); }

/* ═══ المنتجات ═══ */
function viewProducts(){
  const list = PRODUCTS.filter(p => (cat === "الكل" || p.cat === cat) && p.name.includes(q.trim()));
  const cards = list.length ? `<div class="grid">${list.map((p,i) => `
    <article class="card">
      <div class="thumb">${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy"
        onerror="this.parentNode.innerHTML='<span class=&quot;mark&quot; style=&quot;width:70px;height:70px&quot;><small>مكتبة</small><span>ملك</span></span>'">`
        : `<span class="mark" style="width:70px;height:70px"><small>مكتبة</small><span>ملك</span></span>`}</div>
      <div class="body">
        <span class="tag">${esc(p.cat)}</span>
        <h3>${esc(p.name)}</h3>
        <p class="price">${esc(p.price)}$</p>
        <button onclick="add(${i})">أضف إلى العربة</button>
      </div>
    </article>`).join("")}</div>`
    : `<div class="empty"><b style="font-size:18px">ما في منتجات مطابقة.</b>
       <p style="opacity:.7">جرّب كلمة بحث أخرى أو اختر فئة ثانية.</p></div>`;
  window.__list = list;
  return `
  <section>
    <h1 style="font-size:30px;margin-bottom:22px">المنتجات</h1>
    <div class="search"><input id="q" value="${esc(q)}" placeholder="ابحث عن منتج…"
      oninput="q=this.value;refreshGrid()"><span>⌕</span></div>
    <div class="chips">${["الكل",...CATS].map(c =>
      `<button class="chip ${c===cat?"on":""}" onclick="cat='${c}';refreshGrid()">${c}</button>`).join("")}</div>
    <div id="grid">${cards}</div>
  </section>`;
}
function refreshGrid(){
  const v = document.getElementById("q").value;
  render(); const f = document.getElementById("q"); if(f){ f.value = v; f.focus(); }
}

/* ═══ العربة ═══ */
function add(i){
  const p = window.__list[i];
  const f = cart.find(x => x.name === p.name);
  f ? f.qty++ : cart.push({...p, qty:1});
  badge(); toast("أضيف: " + p.name);
}
function badge(){
  const n = cart.reduce((s,i) => s+i.qty, 0);
  const b = document.getElementById("badge");
  b.textContent = n; b.classList.toggle("hide", n === 0);
}
function toast(t){
  const el = document.getElementById("toast");
  el.innerHTML = `<div class="toast">${esc(t)}</div>`;
  setTimeout(() => el.innerHTML = "", 1800);
}
function total(){ return cart.reduce((s,i) => s + (parseFloat(i.price)||0)*i.qty, 0); }
function openCart(){
  const r = document.getElementById("cart-root");
  const body = cart.length ? cart.map((i,x) => `
    <div class="item">
      <div class="n"><b>${esc(i.name)}</b><small>${esc(i.price)}$ للحبة</small></div>
      <div class="qty"><button onclick="qty(${x},-1)">−</button><b>${i.qty}</b><button onclick="qty(${x},1)">+</button></div>
      <button class="del" onclick="rm(${x})">🗑</button>
    </div>`).join("")
    : `<div class="empty"><b style="font-size:18px">العربة فاضية.</b>
       <p><button onclick="closeCart();go('products')" style="text-decoration:underline;font-weight:700">تصفح المنتجات</button></p></div>`;
  r.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeCart()">
    <aside class="drawer">
      <div class="head"><h2>عربة الطلب</h2><button onclick="closeCart()" style="font-size:26px">✕</button></div>
      <div class="list">${body}</div>
      ${cart.length ? `<div class="foot">
        <div class="tot"><span>المجموع التقريبي</span><span>${total().toFixed(2)}$</span></div>
        <p class="note">ما في دفع إلكتروني — الطلب يتأكد بالواتساب.</p>
        <button class="btn wa" onclick="order()">إتمام الطلب عبر واتساب</button></div>` : ""}
    </aside></div>`;
}
const closeCart = () => document.getElementById("cart-root").innerHTML = "";
function qty(i,d){ cart[i].qty = Math.max(1, cart[i].qty+d); badge(); openCart(); }
function rm(i){ cart.splice(i,1); badge(); openCart(); }
function order(){
  const lines = cart.map(i => `• ${i.name} × ${i.qty}`).join("\n");
  window.open(waLink(`مرحبا مكتبة ملك، بحب اطلب:\n${lines}\n\nالمجموع التقريبي: ${total().toFixed(2)}$`), "_blank");
}

/* ═══ تواصل معنا ═══ */
function viewContact(){
  return `<section class="two">
    <div class="box">
      <h2>راسلنا</h2>
      <input class="field" id="c-name" placeholder="الاسم">
      <input class="field" id="c-phone" placeholder="رقم الهاتف">
      <textarea class="field" id="c-msg" rows="5" placeholder="اكتب رسالتك هنا…"></textarea>
      <button class="btn" onclick="sendMsg()">إرسال عبر واتساب</button>
    </div>
    <div class="dark">
      <h2>معلومات التواصل</h2>
      <p><i>◉</i>${CFG.address}</p>
      <a href="tel:+${CFG.wa}"><i>✆</i>${CFG.phone}</a>
      <a href="${waLink()}" target="_blank"><i>✆</i>واتساب: ${CFG.phone}</a>
      <a href="https://instagram.com/${CFG.ig}" target="_blank"><i>◎</i>@${CFG.ig}</a>
      <p><i>✉</i>${CFG.email}</p>
    </div></section>`;
}
function sendMsg(){
  const n = document.getElementById("c-name").value.trim();
  const p = document.getElementById("c-phone").value.trim();
  const m = document.getElementById("c-msg").value.trim();
  if(!n || !m){ toast("املأ الاسم والرسالة."); return; }
  window.open(waLink(`الاسم: ${n}\nالهاتف: ${p}\n\n${m}`), "_blank");
}

/* ═══ لوحة الإدارة — نشر مباشر إلى GitHub ═══ */
let authed = false, editIdx = -1, amsg = "", amsgType = "ok", busy = false;
const TOKEN_KEY = "malak-gh-token";
const getToken = () => localStorage.getItem(TOKEN_KEY) || "";
const apiBase = () => `https://api.github.com/repos/${CFG.ghOwner}/${CFG.ghRepo}/contents/products.json`;

function viewAdmin(){
  if(!authed) return `<section style="max-width:380px;margin:60px auto">
    <div class="box">
      <p style="font-size:26px;color:var(--gold)">🔒</p>
      <h2 style="margin:10px 0 18px">إدارة المنتجات</h2>
      <input class="field" type="password" id="pw" placeholder="كلمة السر"
        onkeydown="if(event.key==='Enter')login()">
      <button class="btn" style="width:100%" onclick="login()">دخول</button>
    </div></section>`;

  if(!getToken()) return `<section style="max-width:420px;margin:60px auto">
    <div class="box">
      <h2 style="margin-bottom:10px">ربط النشر بـ GitHub</h2>
      <p style="margin-bottom:16px;font-size:15px">
        الصق مفتاح GitHub (Personal Access Token) مرة واحدة. يُحفظ في هذا المتصفح فقط
        ولا يُرسل لأي مكان غير GitHub مباشرة.</p>
      <input class="field" type="password" id="tok" placeholder="ghp_xxxxxxxxxxxx" dir="ltr">
      <button class="btn" style="width:100%" onclick="saveToken()">حفظ والمتابعة</button>
    </div></section>`;

  const e = editIdx > -1 ? PRODUCTS[editIdx] : {name:"",price:"",cat:CATS[0],img:""};
  return `<section>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h1 style="font-size:28px">إدارة المنتجات</h1>
      <button onclick="authed=false;go('home')" style="font-weight:700">خروج ⏻</button>
    </div>
    <div class="status"><span class="dot"></span>متّصل بالنشر المباشر — أي حفظ يظهر للجميع فورًا
      <button onclick="if(confirm('نسيان المفتاح من هذا المتصفح؟'))forgetToken()" style="margin-inline-start:auto;font-size:13px;text-decoration:underline">تغيير المفتاح</button>
    </div>
    ${amsg ? `<div class="msg ${amsgType}">${esc(amsg)}</div>` : ""}

    <div class="box" style="margin-bottom:30px">
      <h2>${editIdx > -1 ? "تعديل منتج" : "إضافة منتج جديد"}</h2>
      <div class="admin-grid">
        <input class="field" id="a-name" value="${esc(e.name)}" placeholder="اسم المنتج">
        <input class="field" id="a-price" value="${esc(e.price)}" placeholder="السعر بالدولار — مثال 3.50">
        <select class="field" id="a-cat">${CATS.map(c =>
          `<option ${c===e.cat?"selected":""}>${c}</option>`).join("")}</select>
        <input class="field" id="a-img" dir="ltr" value="${esc(e.img||"")}" placeholder="images/product.jpg أو رابط صورة">
      </div>
      <div style="display:flex;gap:12px">
        <button class="btn" ${busy?"disabled":""} onclick="saveProduct()">
          ${busy ? `<span class="spin"></span> جاري النشر…` : (editIdx > -1 ? "حفظ التعديل ونشره" : "حفظ المنتج ونشره")}</button>
        ${editIdx > -1 ? `<button class="btn ghost" onclick="editIdx=-1;render()">إلغاء</button>` : ""}
      </div>
    </div>

    <h2>المنتجات الحالية (${PRODUCTS.length})</h2>
    ${PRODUCTS.map((p,i) => `<div class="arow">
      <div class="t">${p.img ? `<img src="${esc(p.img)}" alt="">` : ""}</div>
      <div class="i"><b>${esc(p.name)}</b><small>${esc(p.cat)} — ${esc(p.price)}$</small></div>
      <button class="icobtn" onclick="editIdx=${i};render();window.scrollTo(0,0)">✎</button>
      <button class="icobtn del" ${busy?"disabled":""} onclick="delProduct(${i})">🗑</button>
    </div>`).join("")}
  </section>`;
}

function login(){
  if(document.getElementById("pw").value === CFG.adminPass){ authed = true; render(); }
  else toast("كلمة السر غير صحيحة.");
}
function saveToken(){
  const t = document.getElementById("tok").value.trim();
  if(!t){ toast("الصق المفتاح أولًا."); return; }
  localStorage.setItem(TOKEN_KEY, t); render();
}
function forgetToken(){ localStorage.removeItem(TOKEN_KEY); render(); }

async function publish(next, successText, attempt){
  attempt = attempt || 1;
  busy = true; render();
  try{
    const headers = {
      Authorization: "Bearer " + getToken(),
      Accept: "application/vnd.github+json"
    };
    const cur = await fetch(apiBase() + `?ref=${CFG.ghBranch}&_=${Date.now()}`, {
      headers, cache: "no-store"
    });
    if(cur.status === 401 || cur.status === 403){
      throw new Error("المفتاح غير صالح أو ما عندو صلاحية. اضغط «تغيير المفتاح» وحط مفتاحًا جديدًا بصلاحية repo.");
    }
    if(!cur.ok) throw new Error("تعذّر قراءة الملف الحالي من GitHub (" + cur.status + ").");
    const curJson = await cur.json();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(next, null, 2))));
    const put = await fetch(apiBase(), {
      method: "PUT", headers: { ...headers, "Content-Type": "application/json" },
      cache: "no-store",
      body: JSON.stringify({
        message: "تحديث المنتجات — مكتبة ملك",
        content, sha: curJson.sha, branch: CFG.ghBranch
      })
    });
    if(put.status === 409 && attempt < 3){
      busy = false;
      return publish(next, successText, attempt + 1); // إعادة محاولة تلقائية بـ SHA محدّث
    }
    if(!put.ok){
      const b = await put.json().catch(() => ({}));
      throw new Error(b.message || "فشل النشر (" + put.status + ").");
    }
    PRODUCTS = next; amsg = successText; amsgType = "ok";
  }catch(e){
    amsg = e.message || "صار خطأ غير متوقع أثناء النشر."; amsgType = "err";
  }
  busy = false; render();
  setTimeout(() => { amsg = ""; if(page==="admin") render(); }, 4000);
}

function saveProduct(){
  if(busy) return;
  const p = {
    name: document.getElementById("a-name").value.trim(),
    price: document.getElementById("a-price").value.trim(),
    cat: document.getElementById("a-cat").value,
    img: document.getElementById("a-img").value.trim()
  };
  if(!p.name || !p.price){ toast("املأ اسم المنتج والسعر."); return; }
  let next;
  if(editIdx > -1){ next = PRODUCTS.map((x,i) => i===editIdx ? p : x); editIdx = -1; }
  else { next = [p, ...PRODUCTS]; }
  publish(next, editIdx > -1 ? "تم نشر التعديل — يظهر للجميع الآن." : "تم نشر المنتج — يظهر للجميع الآن.");
}
function delProduct(i){
  if(busy) return;
  const next = PRODUCTS.filter((_,x) => x!==i);
  publish(next, "تم حذف المنتج ونشر التحديث.");
}
